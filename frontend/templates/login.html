{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="logo">Wyvern</h1>
            <p class="subtitle">Messagerie sécurisée et anonyme</p>
        </div>

        <div class="auth-form">
            <div class="form-group">
                <label for="identifier">Pseudo ou code 16 chiffres</label>
                <input type="text" id="identifier" placeholder="ex: MonPseudo ou 1234567890123456" autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="current-password" />
            </div>

            <button id="loginBtn" class="btn btn-primary">Se connecter</button>

            <div id="error-msg" class="error-msg"></div>

            <p class="auth-link">
                Pas de compte ? <a href="/register">Créer un compte</a>
            </p>
        </div>
    </div>
</div>

<script>
    // Login au clic
    document.getElementById('loginBtn').addEventListener('click', doLogin);

    //Login aussi avec la touche entrée
    document.querySelectorAll('#identifier, #password').forEach(input => {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    });

    async function doLogin() {
        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error-msg');
        errorEl.textContent = '';

        if (!identifier || !password) {
            errorEl.textContent = 'Veuillez remplir tous les champs.';
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Connexion...';

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await res.json();

            if (res.ok) {
                window.location.href = '/chat';
            } else {
                errorEl.textContent = data.error;
            }
        } catch (err) {
            errorEl.textContent = 'Erreur de connexion au serveur.';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Se connecter';
        }
    }
</script>
{% endblock %}
